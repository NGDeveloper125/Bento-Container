name: Bento Container CI

on:
  pull_request:
    branches: 
      - main
      - development_mvp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Setup Docker
      uses: docker/setup-buildx-action@v2

    - name: Prepare Environment
      run: |
        pwd
        ls -la
        cp BentoConfiguration.json BentoContainerManager/
        cp start-services.sh BentoContainerManager/
        chmod +x BentoContainerManager/start-services.sh
        cd BentoContainerManager
        ls -la

    - name: Build BentoContainerManager
      run: |
        cd BentoContainerManager
        dotnet build
        dotnet publish -c Release -o publish
        cp BentoConfiguration.json publish/
        cp start-services.sh publish/
        chmod +x publish/start-services.sh

    - name: Run Container and Tests
      working-directory: BentoContainerManager/publish
      run: |
        set -e
        ./BentoContainerManager up || exit 1