name: Bento Container CI

on:
  pull_request:
    branches: 
      - main
      - development_mvp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Setup Docker
      uses: docker/setup-buildx-action@v2

    - name: Build BentoContainerManager
      run: |
        cd BentoContainerManager
        dotnet build
        dotnet publish -c Release -o publish

    - name: Run Container and Tests
      run: |
        cd BentoContainerManager/publish
        ./BentoContainerManager up